<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyLab | Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="tarjeta-login">
        <a href="index.html" class="logo">Healthy<span>Lab</span></a>
        <h1 id="titulo">Inicia sesión</h1>

        <form id="formulario" novalidate>
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Coloca un usuario" autocomplete="username"
                    required minlength="7" maxlength="20">
                <small class="error" id="error-user"></small>
            </div>

            <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Escribe tu contraseña"
                    autocomplete="current-password" required>
                <small class="error" id="error-contraseña"></small>
            </div>

            <div class="campo" id="campo-confirmar" hidden>
                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña"
                    autocomplete="new-password">
                <small class="error" id="error-confirmar"></small>
            </div>

            <p class="error error--general" id="error-general" role="alert"></p>

            <button type="submit" class="boton" id="boton">Iniciar sesión</button>
        </form>

        <p class="enlaces">¿Has olvidado tu contraseña?</p>
        <p class="enlaces">
            <span id="texto-cambio">¿No tienes una cuenta?</span>
            <a href="#" id="cambiar">Regístrate</a>
        </p>
    </main>

    <script src="login.js"></script>
</body>

</html>
