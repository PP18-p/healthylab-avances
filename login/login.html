<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Ingresar | HealthyLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body data-pagina="login">
    <header class="encabezado">
        <div class="encabezado__interior">
            <a href="intro.html" class="logo">Healthy<span>Lab</span></a>
            <div class="acciones">
                <a href="intro.html" class="nav__link">Volver al sitio</a>
                <button class="btn-icono" id="modo-oscuro" type="button" aria-label="Activar modo oscuro">
                    <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                    <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="auth">
        <div class="auth__card">
            <div>
                <h1 id="auth-titulo">Bienvenido</h1>
                <p class="suave" id="auth-sub">Ingresa con tu usuario o correo.</p>
            </div>

            <div class="filtros" role="group" aria-label="Acceso">
                <button type="button" class="filtro activo" data-tab="entrar">Ingresar</button>
                <button type="button" class="filtro" data-tab="crear">Crear cuenta</button>
            </div>

            <form id="f-entrar" novalidate>
                <div class="campo">
                    <label for="e-id">Usuario o correo</label>
                    <input type="text" id="e-id" autocomplete="username" placeholder="Escribe tu usuario o correo"
                        required>
                </div>
                <div class="campo">
                    <label for="e-pass">Contraseña</label>
                    <div class="clave">
                        <input type="password" id="e-pass" autocomplete="current-password"
                            placeholder="Escribe tu contraseña" required>
                        <button type="button" class="mini" data-ver="e-pass"
                            aria-label="Mostrar contraseña">Mostrar</button>
                    </div>
                </div>
                <small class="error" id="e-error" role="alert"></small>
                <button type="submit" class="boton">Ingresar</button>
            </form>

            <form id="f-crear" novalidate hidden>
                <div class="campo">
                    <label for="c-nombre">Nombre</label>
                    <input type="text" id="c-nombre" autocomplete="name" placeholder="Escribe tu nombre" required>
                </div>
                <div class="campo">
                    <label for="c-correo">Correo electrónico</label>
                    <input type="email" id="c-correo" autocomplete="email" placeholder="Escribe tu correo" required>
                </div>
                <div class="campo">
                    <label for="c-pass">Contraseña</label>
                    <div class="clave">
                        <input type="password" id="c-pass" autocomplete="new-password" placeholder="Mínimo 8 caracteres"
                            required minlength="8">
                        <button type="button" class="mini" data-ver="c-pass"
                            aria-label="Mostrar contraseña">Mostrar</button>
                    </div>
                </div>
                <div class="campo">
                    <label for="c-pass2">Repite la contraseña</label>
                    <input type="password" id="c-pass2" autocomplete="new-password" placeholder="Repite la contraseña"
                        required>
                </div>
                <small class="error" id="c-error" role="alert"></small>
                <button type="submit" class="boton">Crear cuenta</button>
            </form>
        </div>
    </main>

    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>

</html>
